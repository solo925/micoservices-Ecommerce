input {
  beats {
    port => 5044
  }
}

filter {
  # Parse container logs
  if [container] {
    mutate {
      add_field => { "service_name" => "%{[container][labels][com.docker.compose.service]}" }
    }
  }

  # Parse Django logs
  if [fields][service] == "django" {
    grok {
      match => { 
        "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] %{LOGLEVEL:level} %{DATA:logger}: %{GREEDYDATA:log_message}" 
      }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }

  # Parse HTTP access logs
  if [log_message] =~ /^\d+\.\d+\.\d+\.\d+/ {
    grok {
      match => { 
        "log_message" => "%{IPORHOST:client_ip} - - \[%{HTTPDATE:access_time}\] \"%{WORD:method} %{URIPATH:request_path}(?:%{URIPARAM:request_params})? HTTP/%{NUMBER:http_version}\" %{NUMBER:response_code} %{NUMBER:response_size}" 
      }
    }
    
    date {
      match => [ "access_time", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
    
    mutate {
      convert => { "response_code" => "integer" }
      convert => { "response_size" => "integer" }
    }
  }

  # Parse JSON messages
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Add service type based on service name
  if [service_name] {
    if [service_name] =~ /gateway/ {
      mutate { add_field => { "service_type" => "gateway" } }
    } else if [service_name] =~ /products/ {
      mutate { add_field => { "service_type" => "products" } }
    } else if [service_name] =~ /orders/ {
      mutate { add_field => { "service_type" => "orders" } }
    } else if [service_name] =~ /payments/ {
      mutate { add_field => { "service_type" => "payments" } }
    } else if [service_name] =~ /inventory/ {
      mutate { add_field => { "service_type" => "inventory" } }
    } else if [service_name] =~ /notification/ {
      mutate { add_field => { "service_type" => "notification" } }
    } else if [service_name] =~ /auth/ {
      mutate { add_field => { "service_type" => "authentication" } }
    } else {
      mutate { add_field => { "service_type" => "unknown" } }
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "agent", "ecs", "host", "input", "log" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
    template_name => "microservices"
    template_pattern => "microservices-*"
    template => "/usr/share/logstash/templates/microservices.json"
  }
  
  # Debug output (optional)
  stdout { 
    codec => rubydebug 
  } 
}

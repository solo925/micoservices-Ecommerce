apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ecommerce-gateway-vs
  namespace: ecommerce
spec:
  hosts:
  - ecommerce.local
  - "*"
  gateways:
  - ecommerce-gateway
  http:
  # API Gateway Routes
  - match:
    - uri:
        prefix: /api/gateway/
    route:
    - destination:
        host: gateway-service
        port:
          number: 80
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 100ms
    retries:
      attempts: 3
      perTryTimeout: 30s
    timeout: 30s
  
  # Service Proxy Routes
  - match:
    - uri:
        prefix: /api/products/
    route:
    - destination:
        host: products-service
        port:
          number: 80
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 50ms
    retries:
      attempts: 3
      perTryTimeout: 15s
    timeout: 30s
  
  - match:
    - uri:
        prefix: /api/orders/
    route:
    - destination:
        host: orders-service
        port:
          number: 80
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 50ms
    retries:
      attempts: 3
      perTryTimeout: 15s
    timeout: 30s
  
  - match:
    - uri:
        prefix: /api/payments/
    route:
    - destination:
        host: payments-service
        port:
          number: 80
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 50ms
    retries:
      attempts: 3
      perTryTimeout: 15s
    timeout: 30s
  
  - match:
    - uri:
        prefix: /api/inventory/
    route:
    - destination:
        host: inventory-service
        port:
          number: 80
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 50ms
    retries:
      attempts: 3
      perTryTimeout: 15s
    timeout: 30s
  
  - match:
    - uri:
        prefix: /api/auth/
    route:
    - destination:
        host: auth-service
        port:
          number: 80
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 50ms
    retries:
      attempts: 3
      perTryTimeout: 15s
    timeout: 30s
  
  # Monitoring Routes
  - match:
    - uri:
        prefix: /api/metrics/
    route:
    - destination:
        host: gateway-service
        port:
          number: 80
    timeout: 30s
  
  # Default route to gateway
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: gateway-service
        port:
          number: 80
    timeout: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ecommerce-destinations
  namespace: ecommerce
spec:
  host: "*.ecommerce.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 2
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
---
# Specific destination rules for each service
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: gateway-destination
  namespace: ecommerce
spec:
  host: gateway-service
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 500
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
  - name: v1
    labels:
      version: v1
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: products-destination
  namespace: ecommerce
spec:
  host: products-service
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 30
      http:
        http1MaxPendingRequests: 30
        http2MaxRequests: 300
        maxRequestsPerConnection: 5
        maxRetries: 3
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
  - name: v1
    labels:
      version: v1
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: orders-destination
  namespace: ecommerce
spec:
  host: orders-service
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 40
      http:
        http1MaxPendingRequests: 40
        http2MaxRequests: 400
        maxRequestsPerConnection: 5
        maxRetries: 3
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
  - name: v1
    labels:
      version: v1
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: payments-destination
  namespace: ecommerce
spec:
  host: payments-service
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 20
      http:
        http1MaxPendingRequests: 20
        http2MaxRequests: 200
        maxRequestsPerConnection: 3
        maxRetries: 3
    outlierDetection:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 30
  subsets:
  - name: v1
    labels:
      version: v1
